# ─────────────────────────────────────────────────────────────────────────────
#  kitty — terminal del rice
#  Recargar sin cerrar: Ctrl+Shift+F5   ·   Docs: https://sw.kovidgoyal.net/kitty/conf/
# ─────────────────────────────────────────────────────────────────────────────

# ── Fuente ───────────────────────────────────────────────────────────────────
# Departure Mono: pixelada estilo terminal de los 90. Los kanji que no tenga
# los toma solos de Noto Sans CJK JP (fallback automático de fontconfig).
font_family      DepartureMono Nerd Font
font_size        12.0
# Un poco más de aire entre líneas, se lee mejor con fuentes pixel
modify_font      cell_height 110%

# ── Transparencia ────────────────────────────────────────────────────────────
# 0.0 = invisible, 1.0 = opaco. El desenfoque lo pone Hyprland (blur en
# hypr/config/decorations.lua), kitty solo necesita ser transparente.
background_opacity 0.78
# Permite cambiar la opacidad en vivo con Ctrl+Shift+A y luego M / L
dynamic_background_opacity yes

# ── Ventana ──────────────────────────────────────────────────────────────────
window_padding_width   22
hide_window_decorations yes
confirm_os_window_close 0

# ── Cursor ───────────────────────────────────────────────────────────────────
cursor_shape            block
cursor_blink_interval   0.6
# Rastro animado al mover el cursor (0 = desactivado).
# (Ojo: en kitty los comentarios van siempre en su propia línea.)
cursor_trail            1
cursor_trail_decay      0.1 0.3

# ── Varios ───────────────────────────────────────────────────────────────────
enable_audio_bell no
visual_bell_duration 0.1
visual_bell_color #fe8019

# ── Colores ──────────────────────────────────────────────────────────────────
# Paleta fija del rice. (Antes se usaba themes/noctalia.conf, que Noctalia
# regeneraba según el wallpaper; ese archivo queda sin usar.)
include themes/rice-gruvbox.conf
