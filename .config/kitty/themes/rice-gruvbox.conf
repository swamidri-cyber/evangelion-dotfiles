# ─────────────────────────────────────────────────────────────────────────────
#  Paleta del rice para kitty — Gruvbox cálido, ámbar/dorado sobre negro.
#  color0–7  = colores normales, color8–15 = versiones brillantes.
#  Estos 16 colores son también los "puntitos" que muestra fastfetch.
# ─────────────────────────────────────────────────────────────────────────────

# Fondo, texto y selección
background            #0d0b09
foreground            #ebdbb2
selection_background  #fe8019
selection_foreground  #0d0b09
url_color             #fabd2f

# Cursor: bloque ámbar, el texto debajo se ve en negro
cursor                #fe8019
cursor_text_color     #0d0b09

# Bordes entre splits de kitty (si usás ventanas dentro de kitty)
active_border_color   #fe8019
inactive_border_color #3c3836

# Pestañas
active_tab_background   #fe8019
active_tab_foreground   #0d0b09
inactive_tab_background #1d2021
inactive_tab_foreground #928374
tab_bar_background      #0d0b09

# Negro
color0  #1d2021
color8  #665c54
# Rojo
color1  #cc241d
color9  #fb4934
# Verde (oliva cálido, para no romper la paleta)
color2  #98971a
color10 #b8bb26
# Amarillo / dorado
color3  #d79921
color11 #fabd2f
# Azul (gruvbox, apagado)
color4  #458588
color12 #83a598
# Magenta
color5  #b16286
color13 #d3869b
# Cian
color6  #689d6a
color14 #8ec07c
# Blanco / crema
color7  #a89984
color15 #ebdbb2
