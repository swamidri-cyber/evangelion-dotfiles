# ─────────────────────────────────────────────────────────────────────────────
#  hypridle — qué pasa cuando no tocás la compu
#  Docs: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
# ─────────────────────────────────────────────────────────────────────────────

general {
    # Bloquear = abrir hyprlock (si no está ya abierto)
    lock_cmd = pidof hyprlock || hyprlock
    # Antes de suspender, bloquear (así al volver pide contraseña)
    before_sleep_cmd = loginctl lock-session
}

# A los 10 minutos sin uso: bloquear la pantalla
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# (Opcional) A los 30 minutos: suspender. Descomentá si lo querés.
# listener {
#     timeout = 1800
#     on-timeout = systemctl suspend
# }
