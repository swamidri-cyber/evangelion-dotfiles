# ─────────────────────────────────────────────────────────────────────────────
#  hypridle — qué pasa cuando no tocás la compu
#  Docs: https://wiki.hypr.land/Hypr-Ecosystem/hypridle/
# ─────────────────────────────────────────────────────────────────────────────

general {
    # Bloquear = rice-lock (encendido de tubo); si falla, lock.sh abre hyprlock
    lock_cmd = ~/.config/hypr/scripts/lock.sh
    # Antes de suspender, bloquear (así al volver pide contraseña)
    before_sleep_cmd = loginctl lock-session
}

# A la hora sin uso: bloquear la pantalla (antes 10 min; cambiado a pedido)
listener {
    timeout = 3600
    on-timeout = loginctl lock-session
}

# (Opcional) A los 30 minutos: suspender. Descomentá si lo querés.
# listener {
#     timeout = 1800
#     on-timeout = systemctl suspend
# }
