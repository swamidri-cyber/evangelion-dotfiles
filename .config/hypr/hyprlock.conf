# ─────────────────────────────────────────────────────────────────────────────
#  hyprlock — pantalla de bloqueo (Super+L, o sola tras 10 min sin uso)
#  Probar sin miedo: ejecutá `hyprlock` y desbloqueá con tu contraseña.
#  Si algo sale mal y queda trabada: Ctrl+Alt+F3 → loguearte → `pkill -USR1 hyprlock`
#  Docs: https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/
# ─────────────────────────────────────────────────────────────────────────────

$amber = rgb(fe8019)
$gold  = rgb(fabd2f)
$ochre = rgb(d79921)
$cream = rgb(ebdbb2)
$font  = DepartureMono Nerd Font

general {
    hide_cursor = true
    grace = 3          # segundos en los que mover el mouse cancela el bloqueo
}

# Fondo: captura de la pantalla desenfocada y oscurecida
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    noise = 0.04       # grano, como el resto del rice
    brightness = 0.45
    vignette_strength = 0.4
}

# Hora grande con brillo ámbar
label {
    monitor =
    text = cmd[update:1000] date +%H:%M
    color = $amber
    font_size = 96
    font_family = $font
    shadow_passes = 2
    shadow_size = 8
    shadow_color = rgba(fe801988)
    position = 0, 160
    halign = center
    valign = center
}

# Fecha
label {
    monitor =
    text = cmd[update:60000] date "+%A %d/%m"
    color = $ochre
    font_size = 16
    font_family = $font
    position = 0, 70
    halign = center
    valign = center
}

# Título en kanji (施錠 = cerrado con llave)
label {
    monitor =
    text = 施錠 ─ BLOQUEADO
    color = $gold
    font_size = 13
    font_family = Noto Sans CJK JP
    position = 0, -150
    halign = center
    valign = center
}

# Campo de contraseña
input-field {
    monitor =
    size = 320, 46
    outline_thickness = 1
    rounding = 4
    outer_color = $gold
    inner_color = rgba(0d0b09cc)
    font_color = $cream
    check_color = $amber      # mientras verifica
    fail_color = rgb(fb4934)  # contraseña incorrecta
    dots_size = 0.25
    dots_spacing = 0.4
    placeholder_text = <span foreground="##928374">contraseña</span>
    fail_text = <span foreground="##fb4934">incorrecta ($ATTEMPTS)</span>
    fade_on_empty = false
    position = 0, -90
    halign = center
    valign = center
}
