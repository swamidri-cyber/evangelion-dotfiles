# ─────────────────────────────────────────────────────────────────────────────
#  mpv — reproductor de video del rice (Gruvbox ámbar, Departure Mono)
#  Interfaz (barra de abajo): script-opts/osc.conf
# ─────────────────────────────────────────────────────────────────────────────

# Video: placa AMD → decodificación por hardware
vo=gpu-next
hwdec=auto-safe
keep-open=yes                 # al terminar queda en el último cuadro (no se cierra)
save-position-on-quit=yes     # retoma donde quedaste
autofit-larger=85%x85%        # ventana flotante grande pero sin tapar todo

# Mensajes en pantalla (volumen, posición, etc.)
osd-font="DepartureMono Nerd Font"
osd-font-size=26
osd-color="#ebdbb2"
osd-outline-color="#1d2021"
osd-outline-size=2
osd-back-color="#00000000"
osd-bar-h=2
osd-bar-w=60
osd-bar-outline-size=0.5
osd-bar-marker-style=line
osd-level=1
osd-duration=1200
osd-playing-msg="▶ ${filename}"

# Subtítulos: crema con contorno oscuro
sub-font="DepartureMono Nerd Font"
sub-font-size=38
sub-color="#ebdbb2"
sub-outline-color="#1d2021"
sub-outline-size=2.5
sub-auto=fuzzy

# Captura de un cuadro (tecla s) → ~/Imágenes/Capturas
screenshot-dir="~/Imágenes/Capturas"
screenshot-template="mpv-%F-%P"
screenshot-format=png
