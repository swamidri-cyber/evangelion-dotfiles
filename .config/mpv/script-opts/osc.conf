# Barra de controles de mpv con los colores del rice (nombres de mpv 0.41).
# mpv no acepta comentarios al final de una línea: van siempre en su propia línea.
layout=bottombar
seekbarstyle=bar
deadzonesize=0.5
hidetimeout=900
fadeduration=180
boxalpha=40
timetotal=yes
timems=no
# Hyprland ya maneja la ventana: sin botones de cerrar/minimizar propios
windowcontrols=no

# Fondo de la barra
background_color=#1d2021
# Tiempo y barra de avance (comparten color)
timecode_color=#fe8019
# Íconos de play/pausa, etc.
buttons_color=#ebdbb2
small_buttonsL_color=#a89984
small_buttonsR_color=#a89984
top_buttons_color=#ebdbb2
title_color=#fabd2f
# Botón apretado
held_element_color=#fabd2f
# Cartelito con el tiempo al pasar el mouse por la barra
time_pos_color=#fabd2f
time_pos_outline_color=#1d2021
